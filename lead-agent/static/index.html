<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prozessia Lead-Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Design-Tokens 1:1 aus frontend/src/index.css übernommen (Umsetzungsplan
     Teil D) - keine eigenen Farben/Fonts, damit der Lead-Agent sich wie ein
     Teil desselben Systems anfühlt statt wie ein Fremdkörper. Nur die
     Farb-/Radius-/Font-Variablen, kein Tailwind-Build hier (statische Seite,
     kein Build-Schritt, siehe README.md "UI"). */
  :root {
    color-scheme: light dark;
    --radius: 0.625rem;
    --background: #fdfdfd;
    --foreground: #000000;
    --card: #fdfdfd;
    --card-foreground: #000000;
    --primary: #7033ff;
    --primary-foreground: #ffffff;
    --secondary: #edf0f4;
    --secondary-foreground: #525252;
    --muted: #edf0f4;
    --muted-foreground: #8a8a8f;
    --accent: #e2ebff;
    --accent-foreground: #1e69dc;
    --destructive: #e54b4f;
    --destructive-foreground: #ffffff;
    --border: #e7e7ee;
    --font-sans: "Plus Jakarta Sans", Inter, system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0d0d0d;
      --foreground: #ffffff;
      --card: #161616;
      --card-foreground: #ffffff;
      --primary: #534ab7;
      --primary-foreground: #ffffff;
      --secondary: #1e1e1e;
      --secondary-foreground: #b8b8c2;
      --muted: #161616;
      --muted-foreground: #8a8a94;
      --accent: #2a2548;
      --accent-foreground: #b088ff;
      --destructive: #c0392b;
      --destructive-foreground: #ffffff;
      --border: #2a2a2a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    letter-spacing: -0.01em;
    background: var(--background);
    color: var(--foreground);
    display: flex;
    flex-direction: column;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }

  .shell {
    max-width: 48rem;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0 1rem;
  }

  header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 0 0.75rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .badge {
    width: 2rem; height: 2rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-foreground);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }
  header .sub { font-size: 0.75rem; color: var(--muted-foreground); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-align: center;
    padding: 2rem 0;
  }
  #empty-state .badge { width: 2.75rem; height: 2.75rem; }
  #empty-state h2 { font-family: var(--font-sans); font-weight: 400; font-size: 1.6rem; margin: 0; }
  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    width: 100%;
  }
  @media (max-width: 520px) { .suggestions { grid-template-columns: 1fr; } }
  .suggestions button {
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .suggestions button:hover { background: var(--muted); }
  .suggestions .title { font-size: 0.85rem; font-weight: 500; color: var(--foreground); }
  .suggestions .prompt { font-size: 0.75rem; color: var(--muted-foreground); margin-top: 0.15rem; }

  .row-user { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
  .bubble-user {
    max-width: 80%;
    border-radius: 1.5rem 1.5rem 0.4rem 1.5rem;
    background: var(--muted);
    color: var(--foreground);
    padding: 0.65rem 1.1rem;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .row-assistant { min-width: 0; }
  .assistant-content {
    font-size: 0.95rem;
    line-height: 1.65;
    color: var(--foreground);
  }
  .assistant-content > *:first-child { margin-top: 0; }
  .assistant-content > *:last-child { margin-bottom: 0; }
  .assistant-content h1, .assistant-content h2, .assistant-content h3 {
    font-weight: 500;
    line-height: 1.3;
    margin: 1.1em 0 0.4em;
  }
  .assistant-content h1 { font-size: 1.25rem; }
  .assistant-content h2 { font-size: 1.1rem; }
  .assistant-content h3 { font-size: 1rem; }
  .assistant-content p { margin: 0.6em 0; }
  .assistant-content ul, .assistant-content ol { padding-left: 1.4em; margin: 0.6em 0; }
  .assistant-content li { margin: 0.2em 0; }
  .assistant-content a { color: var(--accent-foreground); text-decoration: underline; text-underline-offset: 2px; }
  .assistant-content strong { font-weight: 600; }
  .assistant-content code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--muted);
    padding: 0.1em 0.35em;
    border-radius: 0.3em;
  }
  .assistant-content pre {
    background: color-mix(in srgb, var(--muted) 60%, transparent);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.8em 1em;
    overflow-x: auto;
  }
  .assistant-content pre code { background: none; padding: 0; }
  .assistant-content blockquote {
    border-left: 3px solid var(--border);
    margin: 0.6em 0;
    padding-left: 0.9em;
    color: var(--muted-foreground);
  }

  /* Markdown-Tabellen (get_combined_leads/export_leads-Ergebnisse kommen
     typischerweise so zurück, siehe Umsetzungsplan Teil D) sauber gerendert
     statt als Roh-Pipe-Zeilen - der frühere index.html hatte gar keine
     Markdown-Verarbeitung. */
  .table-scroll { overflow-x: auto; margin: 0.8em 0; border: 1px solid var(--border); border-radius: 0.75rem; }
  .assistant-content table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  .assistant-content th, .assistant-content td {
    padding: 0.5em 0.8em;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .assistant-content thead th {
    background: var(--muted);
    font-weight: 600;
    color: var(--secondary-foreground);
  }
  .assistant-content tr:last-child td { border-bottom: none; }

  /* Drei versetzt pulsierende Punkte, solange auf die erste Antwort gewartet
     wird - 1:1 aus frontend/src/index.css übernommen. */
  @keyframes thinking-dot {
    0%, 60%, 100% { transform: scale(0.85); opacity: 0.4; }
    30% { transform: scale(1.15); opacity: 1; }
  }
  .thinking { display: flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0; }
  .thinking span {
    width: 0.35rem; height: 0.35rem; border-radius: 999px;
    background: color-mix(in srgb, var(--muted-foreground) 60%, transparent);
    animation: thinking-dot 1.1s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }

  .err { color: var(--destructive); font-size: 0.85rem; }

  form#composer {
    flex-shrink: 0;
    padding: 0.75rem 0 1rem;
    background: var(--background);
  }
  .input-shell {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.15s ease;
  }
  .input-shell:focus-within { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
  textarea#input {
    resize: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.95rem;
    padding: 0.85rem 1.1rem 0.4rem;
    min-height: 2.75rem;
    max-height: 12rem;
    outline: none;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.5rem 0.5rem 0.85rem;
  }
  select#model {
    border: none;
    background: transparent;
    color: var(--muted-foreground);
    font: inherit;
    font-size: 0.75rem;
    height: 1.75rem;
    border-radius: 999px;
    padding: 0 0.4rem;
    cursor: pointer;
  }
  select#model:hover { background: var(--muted); color: var(--foreground); }
  button#send {
    width: 2rem; height: 2rem;
    border-radius: 999px;
    border: none;
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  button#send:disabled { opacity: 0.45; cursor: default; }
  button#send svg { width: 1rem; height: 1rem; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="badge">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    </div>
    <div>
      <h1>Prozessia Lead-Agent</h1>
      <div class="sub">Vault + Close CRM, ein Chat</div>
    </div>
  </header>

  <div id="empty-state">
    <div class="badge" style="width: 2.75rem; height: 2.75rem;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    </div>
    <h2>Womit kann ich helfen?</h2>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div id="log" hidden></div>

  <form id="composer">
    <div class="input-shell">
      <textarea id="input" rows="1" placeholder="z.B. 'Zeig mir alle Leads ohne Kontakt seit 14 Tagen'"></textarea>
      <div class="controls">
        <select id="model">
          <option value="claude-sonnet-5">Sonnet</option>
          <option value="claude-opus-5">Opus</option>
        </select>
        <button id="send" type="submit" title="Senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div id="composer-err" class="err" style="margin-top: 0.5rem;"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script>
// markdown-it rendert GFM-Tabellen bereits im Kern (kein Zusatz-Plugin nötig,
// anders als react-markdown+remark-gfm im Hauptdashboard) - siehe
// Umsetzungsplan Teil D: "Markdown-TABELLEN sauber gerendert, nicht als
// Rohtext". HTML-Eingaben werden per Default escaped (html:false), kein XSS
// über Modellausgaben.
const md = window.markdownit({ html: false, linkify: true, breaks: false });
const defaultTableOpen = md.renderer.rules.table_open || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
md.renderer.rules.table_open = (tokens, idx, options, env, self) =>
  '<div class="table-scroll">' + defaultTableOpen(tokens, idx, options, env, self);
const defaultTableClose = md.renderer.rules.table_close || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
md.renderer.rules.table_close = (tokens, idx, options, env, self) =>
  defaultTableClose(tokens, idx, options, env, self) + '</div>';

const SUGGESTIONS = [
  { title: "Bestandsleads", prompt: "Zeig mir alle qualifizierten Leads als Tabelle." },
  { title: "Kalt gewordene Leads", prompt: "Welche Leads hatten seit 14 Tagen keinen Kontakt?" },
  { title: "Neue Prospects", prompt: "Recherchiere 5 neue Prospects passend zum ICP." },
  { title: "Export", prompt: "Exportiere alle heißen Leads als Excel-Datei." },
];

const log = document.getElementById('log');
const emptyState = document.getElementById('empty-state');
const suggestionsEl = document.getElementById('suggestions');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('model');
const composerErr = document.getElementById('composer-err');

let messages = [];
let streaming = false;

for (const s of SUGGESTIONS) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.innerHTML = `<div class="title"></div><div class="prompt"></div>`;
  btn.querySelector('.title').textContent = s.title;
  btn.querySelector('.prompt').textContent = s.prompt;
  btn.addEventListener('click', () => send(s.prompt));
  suggestionsEl.appendChild(btn);
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 192) + 'px';
}
input.addEventListener('input', autoGrow);

function renderAssistantHtml(text) {
  const html = md.render(text || '');
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  wrap.querySelectorAll('a').forEach((a) => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
  return wrap.innerHTML;
}

function render() {
  const hasMessages = messages.length > 0;
  emptyState.hidden = hasMessages;
  log.hidden = !hasMessages;
  if (!hasMessages) return;

  log.innerHTML = '';
  messages.forEach((m, i) => {
    const isThinking = streaming && i === messages.length - 1 && m.role === 'assistant' && !m.content;
    if (m.role === 'user') {
      const row = document.createElement('div');
      row.className = 'row-user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble-user';
      bubble.textContent = m.content;
      row.appendChild(bubble);
      log.appendChild(row);
    } else {
      const row = document.createElement('div');
      row.className = 'row-assistant';
      if (isThinking) {
        row.innerHTML = '<div class="thinking" aria-label="Lead-Agent denkt nach"><span></span><span></span><span></span></div>';
      } else {
        const content = document.createElement('div');
        content.className = 'assistant-content';
        content.innerHTML = renderAssistantHtml(m.content);
        row.appendChild(content);
      }
      log.appendChild(row);
    }
  });
  log.scrollTop = log.scrollHeight;
}

async function send(overrideText) {
  const text = (overrideText ?? input.value).trim();
  if (!text || streaming) return;
  input.value = '';
  autoGrow();
  composerErr.textContent = '';

  messages.push({ role: 'user', content: text });
  messages.push({ role: 'assistant', content: '' });
  streaming = true;
  sendBtn.disabled = true;
  render();

  let assistantText = '';
  try {
    const resp = await fetch('/api/lead-agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ messages: messages.slice(0, -1), model: modelSelect.value }),
    });
    if (!resp.ok || !resp.body) {
      throw new Error('HTTP ' + resp.status);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const data = JSON.parse(payload);
          if (data.chunk) {
            assistantText += data.chunk;
            messages[messages.length - 1].content = assistantText;
            render();
          } else if (data.error) {
            composerErr.textContent = 'Fehler: ' + data.error;
          }
        } catch (_) { /* fragmentierte Zeile ignorieren */ }
      }
    }
  } catch (ex) {
    composerErr.textContent = 'Verbindung unterbrochen. Bitte erneut versuchen.';
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    render();
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  send();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

render();
</script>
</body>
</html>
