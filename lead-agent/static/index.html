<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prozessia Lead-Agent</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 1rem; background: #fafafa; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  h1 { font-size: 1.1rem; }
  #log { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 5rem; }
  .msg { padding: 0.6rem 0.9rem; border-radius: 0.6rem; white-space: pre-wrap; line-height: 1.4; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; max-width: 80%; }
  .assistant { align-self: flex-start; background: #e5e7eb; color: #111; max-width: 80%; }
  @media (prefers-color-scheme: dark) { .assistant { background: #333; color: #eee; } }
  form { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 0.5rem; padding: 0.75rem; background: inherit; border-top: 1px solid #8883; max-width: 760px; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 0.5rem; border-radius: 0.4rem; border: 1px solid #8888; font: inherit; }
  button { padding: 0 1rem; border-radius: 0.4rem; border: none; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .err { color: #dc2626; }
</style>
</head>
<body>
<h1>Prozessia Lead-Agent</h1>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="z.B. 'Zeig mir alle Leads ohne Kontakt seit 2 Wochen'"></textarea>
  <button id="send">Senden</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let messages = [];

function addBubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  messages.push({ role: 'user', content: text });
  addBubble('user', text);
  const assistantEl = addBubble('assistant', '');

  try {
    const resp = await fetch('/api/lead-agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ messages }),
    });
    if (!resp.ok || !resp.body) {
      assistantEl.textContent = 'Fehler: ' + resp.status;
      assistantEl.classList.add('err');
      sendBtn.disabled = false;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let assistantText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const data = JSON.parse(payload);
          if (data.chunk) {
            assistantText += data.chunk;
            assistantEl.textContent = assistantText;
          } else if (data.error) {
            assistantEl.textContent += '\n[Fehler: ' + data.error + ']';
            assistantEl.classList.add('err');
          }
        } catch (_) { /* ignore malformed lines */ }
      }
    }
    messages.push({ role: 'assistant', content: assistantText });
  } catch (ex) {
    assistantEl.textContent = 'Verbindungsfehler: ' + ex;
    assistantEl.classList.add('err');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
