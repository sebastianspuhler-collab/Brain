services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - VAULT_PATH=/vault
      - USERS_FILE=/run/secrets/users.json
    volumes:
      - ${VAULT_PATH}:/vault
      - ./backend/users.json:/run/secrets/users.json:ro
    restart: unless-stopped
    # Echter PID-1-Reaper (tini) statt Uvicorn/Python selbst als PID 1
    # (Umsetzungsplan 2026-08-06, nach Zombie-Prozess-Leck durch abgebrochene
    # claude-Subprozesse, siehe claude_cli.py:terminate_process_tree()).
    # Uvicorn ruft nie waitpid() fuer Prozesse auf, die es nicht selbst
    # gestartet hat - verwaiste Enkel-Prozesse (MCP-Server, Subagenten), die
    # auf PID 1 reparented werden, blieben ohne tini fuer immer Zombies.
    init: true
    # Sicherheitsnetz: begrenzt den Schaden eines kuenftigen, heute noch
    # unbekannten Leaks. Normalbetrieb liegt weit darunter - bei Ueberschreiten
    # killt der Kernel den Container hart, "restart: unless-stopped" startet
    # ihn automatisch sauber neu, statt dass der Host schleichend
    # (ueber Tage, wie am 2026-08-06 beobachtet) in Mitleidenschaft gezogen wird.
    mem_limit: 4g
    pids_limit: 2000
    networks:
      - default
      # Schmale Brücke NUR zum dev-agent-Container (Umsetzungsplan 2026-07-25,
      # /api/dev-agent/chat in chat.py) - backend sieht dadurch NICHT die
      # anderen Container auf dem dev-agent-bridge-Netzwerk (da gibt es keine
      # außer dev-agent selbst), und die Sandbox bekommt dadurch weiterhin
      # keinen Zugriff auf backend's eigenes default-Netzwerk/Volumes.
      - dev-agent-bridge

  # LinkedIn-Karussell: generiert nur die Slide-Texte via Claude (Bilder/PDF/
  # Cloudinary-Upload/Buffer-Push laufen im backend-Service). Rein intern,
  # kein Traefik-Label - nur von backend über den Docker-DNS-Namen erreichbar.
  content-engine:
    build: ./services/content-engine
    env_file: ./backend/.env
    restart: unless-stopped
    networks:
      - default

  # Frontend + Caddy als reiner Static-File-Server + interner Reverse-Proxy zu
  # backend:9000 - KEIN eigenes TLS mehr (das übernimmt das bestehende Traefik
  # vor diesem Container). Caddy hört nur noch auf Port 80 im internen Netz.
  web:
    build: ./frontend
    restart: unless-stopped
    networks:
      - default
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"

      - "traefik.http.routers.brain.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.brain.entrypoints=websecure"
      - "traefik.http.routers.brain.tls.certresolver=letsencrypt"
      - "traefik.http.services.brain.loadbalancer.server.port=80"

      # HTTP -> HTTPS Redirect (Traefiks ACME-HTTP-Challenge auf Port 80 bleibt
      # davon unberührt, die fängt Traefik auf Entrypoint-Ebene vorher ab)
      - "traefik.http.routers.brain-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.brain-http.entrypoints=web"
      - "traefik.http.routers.brain-http.middlewares=brain-https-redirect"
      - "traefik.http.middlewares.brain-https-redirect.redirectscheme.scheme=https"

  # Entwickler-Agent-Sandbox (Umsetzungsplan 2026-07-25): isolierter Container
  # ohne docker.sock, ohne --privileged, NUR auf dem schmalen
  # dev-agent-bridge-Netzwerk mit backend - kann die anderen Produktions-
  # Container (twenty-crm, schaufler-*, n8n, ...) weder sehen noch erreichen
  # (live verifiziert: kein docker.sock, `getent hosts <anderer-container>`
  # schlägt fehl). Eigenes Volume (/workspace = "Prozessia-Dev"-Ordner),
  # Ressourcen-Limits gegen Überlastung der 4-Kern-VPS, fester
  # Host-Port-Bereich für Live-Vorschau-Links (kein Traefik/DNS nötig - DNS
  # ist hier nicht wildcard, siehe DEPLOY.md).
  dev-agent:
    build: ./dev-agent
    env_file: ./dev-agent/.env
    environment:
      # Commits im Namen des Agenten statt der auf dem VPS eingeloggten
      # Github-Identität (der SSH-Key unten authentifiziert nur den Push,
      # bestimmt nicht die Commit-Identität).
      - GIT_AUTHOR_NAME=Prozessia Dev-Agent
      - GIT_AUTHOR_EMAIL=dev-agent@prozessia.de
      - GIT_COMMITTER_NAME=Prozessia Dev-Agent
      - GIT_COMMITTER_EMAIL=dev-agent@prozessia.de
    volumes:
      - dev-agent-workspace:/workspace
      # Sebastians bestehender, mit seinem persönlichen GitHub-Account
      # (AminDouioui) verknüpfter Host-SSH-Key, read-only eingebunden - kein
      # frisch erzeugter, eng begrenzter Key (bewusste Abweichung vom
      # ursprünglichen Plan, auf Wunsch von Sebastian 2026-07-25).
      - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /root/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    ports:
      - "8100-8120:8100-8120"
    restart: unless-stopped
    networks:
      - dev-agent-bridge
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g

networks:
  traefik_web:
    external: true
  dev-agent-bridge: {}

volumes:
  dev-agent-workspace: {}
